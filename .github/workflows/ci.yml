name: Inox Hydra CI/CD Pipeline

# Runs on windows-latest, deliberately.
#
# This is a Windows product: the credential vault uses DPAPI, the launchers are
# .bat files, the tray controller calls the Win32 shell API through ctypes, and
# the distributable embeds an ABI-specific CPython for win64. Testing on Linux
# would validate a configuration no user will ever run, while producing failures
# that say nothing about whether the product works.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: Build, Quality & Automated Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Code Analysis & Syntax Validation
        run: |
          flake8 studio tests tools --count --select=E9,F63,F7,F82 --show-source --statistics

      # A build where the extension manifest and the application disagree about
      # the version is a support problem that only surfaces after install.
      - name: Verify Version Consistency Across Surfaces
        run: python tools/sync_version.py --check

      - name: Run Enterprise Backend Test Suite (9 Suites)
        run: python tests/test_studio_backend.py

      - name: Run Full Automated Test Suite (pytest)
        run: pytest tests studio/tests -q

  package-verify:
    name: Distributable Build & Clean-Install Verification
    runs-on: windows-latest
    needs: test-and-verify

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          # setuptools is NOT preinstalled on Python 3.12+ runners, and
          # verify_package builds with --no-isolation, so the backend has to
          # be present in the ambient environment.
          pip install build wheel setuptools

      # Builds a wheel, installs it into a virtual environment with no access to
      # system site packages, and boots it from an unrelated working directory.
      # Catches undeclared dependencies and missing package data, neither of
      # which a normal test run can detect.
      - name: Verify The Distributable Actually Runs
        run: python tools/verify_package.py
