name: Inox Hydra CI/CD Pipeline

# Tests run on Windows, macOS and Linux; the distributable is built and
# verified on Windows only, because it embeds an ABI-specific CPython for win64.
# See the comments on each job for why each half is where it is.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: Build, Quality & Automated Test Suite (${{ matrix.os }})
    # The suite ran on windows-latest alone, and the backend now has macOS and
    # Linux paths: Keychain, Secret Service, LaunchAgent and XDG autostart.
    # Each of those tests is gated behind skipif for the platform it is live
    # on, so on a Windows only runner all four skip, and the platforms where
    # they would run never invoked pytest at all. desktop.yml has a matrix but
    # builds bundles rather than running tests.
    #
    # The result was four tests that read as coverage and executed nowhere.
    # That is the same shape as the release workflow check gated behind a
    # pyyaml nobody declared, and the docs staging check waiting on an
    # artifact CI never produced. A skipif is only honest if something,
    # somewhere, does not skip.
    #
    # fail-fast is off so a failure on one platform does not cancel the others
    # and hide whether they would have passed.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # studio/frontend_next is the built React interface, and it is gitignored,
      # so a fresh checkout does not contain it. Without this step every
      # artifact built here falls back to the vanilla page and NOTHING FAILS:
      # get_frontend_dir() returns the old interface, the product boots, and the
      # suite stays green. The omission is visible only by looking at the UI.
      - name: Set up Node Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: studio/ui/package-lock.json

      - name: Build The Studio Interface
        working-directory: studio/ui
        shell: bash
        run: |
          npm ci
          npm run build

      # Fail loudly here. A build that quietly produced nothing is the single
      # case the runtime fallback would hide completely.
      # shell: bash, because this job now runs on a matrix of Windows, macOS and
      # Linux. The PowerShell form of this check was a syntax error on two of
      # the three, and it guards the step that stops a build shipping the old
      # interface, so it has to run everywhere rather than pass by not running.
      - name: Confirm The Interface Was Built
        shell: bash
        run: |
          test -f studio/frontend_next/index.html || {
            echo "studio/frontend_next/index.html is missing: the interface did not build" >&2
            exit 1
          }

      # tests/test_e2e_browser_flows.py importorskips playwright, and nothing
      # here installed it, so every browser test skipped on every platform and
      # the run read as green. Driving the interface caught more defects than
      # the rest of the suite combined (docs/UI_AGENT_WORKFLOW.md section 5).
      - name: Install Playwright And Chromium
        shell: bash
        run: |
          pip install playwright==1.63.0
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi

      - name: Static Code Analysis & Syntax Validation
        run: |
          flake8 studio tests tools --count --select=E9,F63,F7,F82 --show-source --statistics

      # A build where the extension manifest and the application disagree about
      # the version is a support problem that only surfaces after install.
      - name: Verify Version Consistency Across Surfaces
        run: python tools/sync_version.py --check

      - name: Run Enterprise Backend Test Suite (9 Suites)
        run: python tests/test_studio_backend.py

      # -rs names every skip. Without it the run reports a bare "3 skipped"
      # and there is no way to tell which three, so a test that quietly stops
      # running here looks exactly like one that passes. That is how the
      # hygiene suite went a week checking filenames instead of file contents.
      - name: Run Full Automated Test Suite (pytest)
        run: pytest tests studio/tests -q -rs

      # Every rail section, both themes, desktop and phone width: console
      # errors, any request that leaves loopback, failed API calls, axe
      # violations of serious or critical impact. One platform is enough for a
      # layout check, and the report is kept either way so a failure can be
      # seen rather than re-run.
      - name: Audit Every Screen In Both Themes
        if: runner.os == 'Linux'
        run: python tools/ui_audit.py --out scratch/ui_audit/ci

      - name: Keep The Audit Report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: scratch/ui_audit/ci
          if-no-files-found: ignore

  package-verify:
    name: Distributable Build & Clean-Install Verification
    # Stays Windows only. The distributable embeds ABI specific compiled
    # wheels and an embeddable CPython, so building it anywhere else produces
    # an artifact that cannot import its own dependencies.
    #
    # `needs` on a matrix job waits for every leg of it, so this runs only
    # once all three platforms have passed their tests.
    runs-on: windows-latest
    needs: test-and-verify

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          # setuptools is NOT preinstalled on Python 3.12+ runners, and
          # verify_package builds with --no-isolation, so the backend has to
          # be present in the ambient environment.
          pip install build wheel setuptools

      # studio/frontend_next is the built React interface, and it is gitignored,
      # so a fresh checkout does not contain it. Without this step every
      # artifact built here falls back to the vanilla page and NOTHING FAILS:
      # get_frontend_dir() returns the old interface, the product boots, and the
      # suite stays green. The omission is visible only by looking at the UI.
      - name: Set up Node Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: studio/ui/package-lock.json

      - name: Build The Studio Interface
        working-directory: studio/ui
        shell: bash
        run: |
          npm ci
          npm run build

      # Fail loudly here. A build that quietly produced nothing is the single
      # case the runtime fallback would hide completely.
      # shell: bash, because this job now runs on a matrix of Windows, macOS and
      # Linux. The PowerShell form of this check was a syntax error on two of
      # the three, and it guards the step that stops a build shipping the old
      # interface, so it has to run everywhere rather than pass by not running.
      - name: Confirm The Interface Was Built
        shell: bash
        run: |
          test -f studio/frontend_next/index.html || {
            echo "studio/frontend_next/index.html is missing: the interface did not build" >&2
            exit 1
          }

      # Builds a wheel, installs it into a virtual environment with no access to
      # system site packages, and boots it from an unrelated working directory.
      # Catches undeclared dependencies and missing package data, neither of
      # which a normal test run can detect.
      - name: Verify The Distributable Actually Runs
        run: python tools/verify_package.py

      # The release gate, run on every pull request. It was only ever run on a
      # tag, so when the security gate started refusing its bare test client,
      # nothing went red until the release itself could not publish.
      # Pillow's Windows wheels load FriBiDi at run time and do not ship it;
      # without it raqm is off and Hindi and Gujarati overlays are left off
      # generated images (R7-N1). vcpkg is preinstalled on Windows runners and
      # builds it from source; the builder copies the DLL and its LGPL licence
      # beside python.exe and refuses a runtime where raqm does not load.
      - name: Build FriBiDi For Complex Text Layout
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install fribidi:x64-windows
          $dll = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" -Filter "*fribidi*.dll" | Select-Object -First 1
          if (-not $dll) { throw "vcpkg did not produce a FriBiDi DLL" }
          "INOX_FRIBIDI_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FriBiDi: $($dll.FullName)"

      - name: Build The Portable Artifact
        run: |
          pip install -r requirements.txt
          python tools/build_portable.py

      - name: Smoke Test The Portable Artifact
        shell: bash
        run: python tools/smoke_portable.py
