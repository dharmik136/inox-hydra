name: Inox Hydra Desktop Shell

# Builds the native desktop applications and installers across platforms.
#
# Runs on a matrix across windows-latest, macos-latest and ubuntu-latest.
# The bundle embeds a platform-specific Python runtime and compiled wheels,
# links against the platform webview (WebView2 on Windows, WebKitGTK on Linux,
# WebKit/WKWebView on macOS), and is packaged with NSIS, DMG/app, or DEB/AppImage.
#
# Why this exists rather than a local build script: the toolchain is Rust plus
# platform-specific SDKs and compilers, which is several gigabytes a
# contributor would otherwise have to install to change one line of Python.
# The runner already carries all of it. Release artifacts should not be built
# on a developer laptop anyway, because nobody can reproduce what was on it.
#
# Trigger by pushing a v*.*.* tag, or manually from the Actions tab.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "tools/stage_desktop_payload.py"
      - "tools/build_portable.py"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop Application (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    # Matrix builds across platforms (previously runs-on: windows-latest):
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # This pin decides which embeddable runtime ships, because the builder
      # chooses it from the building interpreter's own version.
      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Linux requires webkit2gtk-4.1 and related development packages to
      # compile Tauri v2 and its system tray and indicator bindings.
      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Preinstalled on windows-latest along with the MSVC toolchain, so this
      # only pins and caches rather than installing a compiler.
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Regenerated rather than trusted from the repository, so a stale commit
      # cannot ship a shell wearing a different icon than the tray.
      - name: Generate Application Icons
        run: python tools/generate_icons.py

      - name: Stage The Python Payload
        run: python tools/stage_desktop_payload.py

      - name: Verify The Payload Layout
        shell: pwsh
        run: |
          # Fail here, with a readable message, rather than inside a Rust
          # panic on a user's machine three weeks later.
          $missing = @()
          foreach ($p in @(
            "desktop/payload/app/studio/backend/app.py",
            "desktop/payload/lib"
          )) { if (-not (Test-Path $p)) { $missing += $p } }

          if ($env:RUNNER_OS -eq "Windows") {
            if (-not (Test-Path "desktop/payload/runtime/python.exe")) {
              $missing += "desktop/payload/runtime/python.exe"
            }
            $pth = Get-ChildItem "desktop/payload/runtime" -Filter "python*._pth" -ErrorAction SilentlyContinue
            if (-not $pth) { $missing += "desktop/payload/runtime/python*._pth" }
          } else {
            $pyBin = "desktop/payload/runtime/bin/python3"
            if (-not (Test-Path $pyBin)) { $missing += $pyBin }
            $pth = Get-ChildItem "desktop/payload/runtime/lib" -Recurse -Filter "inox_hydra.pth" -ErrorAction SilentlyContinue
            if (-not $pth) { $missing += "inox_hydra.pth in runtime/lib" }
          }

          if (Test-Path "desktop/payload/app/studio/data") {
            throw "payload/app/studio/data exists. User state would land in application bundle and an update would destroy it."
          }

          if ($missing.Count -gt 0) {
            throw "Payload is incomplete: $($missing -join ', ')"
          }
          "Payload layout verified."

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      # ---------------------------------------------------------------------
      # Code signing
      #
      # Unsigned, every download trips SmartScreen and some antivirus engines
      # quarantine the installer outright, which is the exact failure the
      # portable builder was written to avoid by refusing PyInstaller. Shipping
      # a Rust binary only helps if that binary is signed.
      #
      # Signing happens through Tauri's signCommand rather than as a step after
      # the build, and the ordering is the reason. NSIS embeds the application
      # executable inside the installer, so signing the artifacts afterwards
      # would leave the embedded copy unsigned and SmartScreen would still
      # complain once the installer ran. signCommand makes Tauri sign each
      # binary as it produces it, before packaging.
      #
      # Preferred: Azure Artifact Signing, which Microsoft renamed from Trusted
      # Signing in January 2026. It is ten dollars a month and open to
      # individual developers, which replaced the old several hundred a year
      # plus a hardware token. Set these repository secrets:
      #
      #   AZURE_TENANT_ID
      #   AZURE_CLIENT_ID
      #   AZURE_CLIENT_SECRET
      #   AZURE_SIGNING_ENDPOINT        https://<region>.codesigning.azure.net
      #   AZURE_SIGNING_ACCOUNT         the signing account name
      #   AZURE_SIGNING_PROFILE         the certificate profile name
      #
      # The identity needs the Artifact Signing Certificate Profile Signer role
      # (named Trusted Signing Certificate Profile Signer before the rename).
      #
      # A build without them stays green and produces a working unsigned
      # artifact, so a fork can still build. It says so loudly, because a
      # warning nobody reads is how an unsigned release ships by accident.
      # ---------------------------------------------------------------------
      - name: Decide Whether This Build Can Be Signed
        id: signing
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") {
            "configured=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "Signing: Azure Artifact Signing is Windows-specific. Skipping on $env:RUNNER_OS."
            exit 0
          }
          $configured = [bool]$env:AZURE_CLIENT_ID -and [bool]$env:AZURE_SIGNING_ENDPOINT
          "configured=$($configured.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($configured) {
            "Signing: Azure Artifact Signing is configured. The bundle will be signed."
          } else {
            "::warning title=Unsigned build::No signing credentials are configured. This installer will trip SmartScreen on download and may be quarantined by antivirus. See docs/DESKTOP_SHELL.md for setup."
            "Signing: NOT configured. Producing an unsigned artifact."
          }
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}

      - name: Install The Signing Tool
        if: runner.os == 'Windows' && steps.signing.outputs.configured == 'true'
        run: cargo install trusted-signing-cli --locked

      # Written at build time rather than committed, because tauri.conf.json is
      # the same file a local unsigned build uses and must not carry a
      # signCommand pointing at credentials that are not there. Tauri merges
      # this over the base config.
      - name: Configure Signing
        if: runner.os == 'Windows' && steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          $cfg = @{
            bundle = @{
              windows = @{
                signCommand = "trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE %1"
              }
            }
          }
          $cfg | ConvertTo-Json -Depth 8 | Out-File -FilePath "desktop/signing.json" -Encoding utf8
          "Wrote desktop/signing.json (credentials are read from the environment, not written here)."
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}

      # ---------------------------------------------------------------------
      # Auto update, on the same terms as signing: wired, and off until the
      # keys exist.
      #
      # Two different keys are involved and confusing them is the usual
      # mistake. Code signing proves to Windows who published the installer.
      # Updater signing proves to the application that an update came from the
      # same author as the build it is replacing. An update endpoint without
      # the second one is a way to install arbitrary software on the user's
      # machine, which is why the plugin refuses to run without a public key.
      #
      # Generate the pair once, on your own machine, and keep the private half:
      #
      #   npm exec --yes -- tauri signer generate -w "$HOME/.tauri/inox-hydra.key"
      #
      # Then set:
      #
      #   TAURI_SIGNING_PRIVATE_KEY           contents of the .key file
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the passphrase, or empty
      #   TAURI_UPDATER_PUBKEY                contents of the .key.pub file
      #
      # The public half is not a secret and is compiled into the application.
      # It lives in the secret store only so that its absence can switch the
      # whole feature off, which is what keeps a fork's build working.
      # ---------------------------------------------------------------------
      - name: Decide Whether This Build Can Update Itself
        id: updater
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -ne "Windows") {
            "configured=false" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "Updates: Updater manifest is currently configured for Windows releases. Skipping on $env:RUNNER_OS."
            exit 0
          }
          $configured = [bool]$env:TAURI_UPDATER_PUBKEY -and [bool]$env:TAURI_SIGNING_PRIVATE_KEY
          "configured=$($configured.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ($configured) {
            "Updates: configured. The bundle will carry an updater and a signed artifact."
          } elseif ($env:TAURI_UPDATER_PUBKEY -or $env:TAURI_SIGNING_PRIVATE_KEY) {
            "::warning title=Half configured updater::Only one of TAURI_UPDATER_PUBKEY and TAURI_SIGNING_PRIVATE_KEY is set. Both are required, so updates stay off. A public key with no private key produces an application that checks for updates it can never verify."
            "Updates: NOT configured, and one of the two keys is set. See the warning."
          } else {
            "Updates: not configured. This build will report that in the tray rather than failing."
          }
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # Written at build time for the same reason signing.json is: the base
      # config is what a local unsigned build uses, and it must not name a
      # public key that this checkout does not have.
      - name: Configure Updates
        if: runner.os == 'Windows' && steps.updater.outputs.configured == 'true'
        shell: pwsh
        run: |
          $cfg = @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{
              updater = @{
                pubkey = $env:TAURI_UPDATER_PUBKEY
                endpoints = @("https://github.com/${{ github.repository }}/releases/latest/download/latest-desktop.json")
                windows = @{ installMode = "passive" }
              }
            }
          }
          $cfg | ConvertTo-Json -Depth 8 | Out-File -FilePath "desktop/updater.json" -Encoding utf8
          "Wrote desktop/updater.json. The private key is read from the environment and is not written here."
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}

      - name: Build The Desktop Bundle
        shell: pwsh
        run: |
          $buildArgs = @("tauri", "build", "--config", "desktop/src-tauri/tauri.conf.json")
          if ("${{ steps.signing.outputs.configured }}" -eq "true") {
            $buildArgs += @("--config", "desktop/signing.json")
          }
          if ("${{ steps.updater.outputs.configured }}" -eq "true") {
            $buildArgs += @("--config", "desktop/updater.json")
          }
          npm exec --yes -- @buildArgs
        env:
          # Read by trusted-signing-cli through DefaultAzureCredential.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Updater signing, separate from code signing. Not yet enabled; see
          # docs/DESKTOP_SHELL.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate The Installer
        id: artifact
        shell: pwsh
        run: |
          $bundleDir = "desktop/src-tauri/target/release/bundle"
          $file = $null
          if ($env:RUNNER_OS -eq "Windows") {
            $file = Get-ChildItem -Recurse -Filter "*-setup.exe" -Path $bundleDir -ErrorAction SilentlyContinue | Select-Object -First 1
          } elseif ($env:RUNNER_OS -eq "macOS") {
            $file = Get-ChildItem -Recurse -Filter "*.dmg" -Path $bundleDir -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $file) {
              $file = Get-ChildItem -Recurse -Filter "*.app" -Path $bundleDir -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          } else {
            $file = Get-ChildItem -Recurse -Filter "*.AppImage" -Path $bundleDir -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $file) {
              $file = Get-ChildItem -Recurse -Filter "*.deb" -Path $bundleDir -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }
          if (-not $file) { throw "No package artifact was produced for $env:RUNNER_OS under $bundleDir. Check bundle step output." }
          "path=$($file.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Built $($file.Name), $([math]::Round($file.Length / 1MB, 1)) MB"

      # The check that matters. A signCommand that silently did nothing, an
      # expired certificate, or a credential without the signer role all
      # produce a build that looks successful and an artifact that is not
      # signed. Asking Windows itself is the only way to know.
      - name: Verify The Signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "${{ steps.artifact.outputs.path }}"
          "Installer status: $($sig.Status)"
          if ($sig.SignerCertificate) {
            "Signed by:         $($sig.SignerCertificate.Subject)"
            "Expires:           $($sig.SignerCertificate.NotAfter)"
          }

          if ("${{ steps.signing.outputs.configured }}" -eq "true") {
            if ($sig.Status -ne "Valid") {
              throw "Signing was configured but the installer is not validly signed (status: $($sig.Status)). Refusing to publish a build that only looks signed."
            }
            "Signature verified."
          } else {
            if ($sig.Status -eq "Valid") {
              "Unexpectedly signed without configuration. Investigate before publishing."
            } else {
              "::warning title=Unsigned artifact::This installer is unsigned and will warn on download."
            }
          }

      # The same reasoning as Verify The Signature, for the other key. Tauri
      # writes the .sig next to the installer only when it actually signed
      # one. If it is missing, the build produced an update nobody can verify,
      # and publishing it would mean shipping a manifest that every client
      # rejects. Better to fail here than to break updating for the people who
      # already installed.
      - name: Build The Update Manifest
        id: updatefile
        if: runner.os == 'Windows' && steps.updater.outputs.configured == 'true'
        shell: pwsh
        run: |
          $installer = "${{ steps.artifact.outputs.path }}"
          $sigPath = "$installer.sig"
          if (-not (Test-Path $sigPath)) {
            throw "Updates were configured but no signature was produced at $sigPath. Refusing to publish an update the application cannot verify."
          }

          $signature = (Get-Content $sigPath -Raw).Trim()
          if (-not $signature) { throw "The signature file is empty." }

          $version = (Get-Content "studio/__version__.py" -Raw | Select-String -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $installerName = [System.IO.Path]::GetFileName($installer)
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/$installerName"

          # The platform key is what the client looks itself up by. A wrong one
          # produces TargetNotFound on every machine, which reads to a user as
          # "there is no update" rather than as a broken manifest.
          $manifest = [ordered]@{
            version   = $version
            notes     = "See the release notes at https://github.com/${{ github.repository }}/releases/tag/v$version"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $downloadUrl
              }
            }
          }

          $out = "desktop/latest-desktop.json"
          $manifest | ConvertTo-Json -Depth 8 | Out-File -FilePath $out -Encoding utf8
          "path=$((Resolve-Path $out).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sig=$sigPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          ""
          "Update manifest for $version:"
          Get-Content $out

      - name: Upload The Installer
        uses: actions/upload-artifact@v4
        with:
          name: LinkedIn-Studio-${{ matrix.os }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      # The manifest and the .sig go up with the installer or not at all.
      # A release carrying a manifest that points at an installer which is not
      # there yet would have every client download a 404 and report a failed
      # update.
      - name: Attach To The Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.updatefile.outputs.sig }}
            ${{ steps.updatefile.outputs.path }}
          fail_on_unmatched_files: false
