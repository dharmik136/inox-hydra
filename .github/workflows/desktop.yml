name: Inox Hydra Desktop Shell

# Builds the native Windows application and its installer.
#
# Runs on a Windows runner, and only on a Windows runner. The bundle embeds an
# ABI specific CPython and compiled wheels, links against WebView2, and is
# packaged with NSIS. There is no meaningful cross build.
#
# Why this exists rather than a local build script: the toolchain is Rust plus
# the MSVC C++ build tools plus the Windows SDK, which is several gigabytes a
# contributor would otherwise have to install to change one line of Python.
# The runner already carries all of it. Release artifacts should not be built
# on a developer laptop anyway, because nobody can reproduce what was on it.
#
# Trigger by pushing a v*.*.* tag, or manually from the Actions tab.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "tools/stage_desktop_payload.py"
      - "tools/build_portable.py"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Windows Desktop Application
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # This pin decides which embeddable runtime ships, because the builder
      # chooses it from the building interpreter's own version.
      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Preinstalled on windows-latest along with the MSVC toolchain, so this
      # only pins and caches rather than installing a compiler.
      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # Regenerated rather than trusted from the repository, so a stale commit
      # cannot ship a shell wearing a different icon than the tray.
      - name: Generate Application Icons
        run: python tools/generate_icons.py

      - name: Stage The Python Payload
        run: python tools/stage_desktop_payload.py

      - name: Verify The Payload Layout
        shell: pwsh
        run: |
          # Fail here, with a readable message, rather than inside a Rust
          # panic on a user's machine three weeks later.
          $missing = @()
          foreach ($p in @(
            "desktop/payload/runtime/python.exe",
            "desktop/payload/app/studio/backend/app.py",
            "desktop/payload/lib"
          )) { if (-not (Test-Path $p)) { $missing += $p } }

          $pth = Get-ChildItem "desktop/payload/runtime" -Filter "python*._pth" -ErrorAction SilentlyContinue
          if (-not $pth) { $missing += "desktop/payload/runtime/python*._pth" }

          if (Test-Path "desktop/payload/app/studio/data") {
            throw "payload/app/studio/data exists. User state would land in Program Files and an update would destroy it."
          }

          if ($missing.Count -gt 0) {
            throw "Payload is incomplete: $($missing -join ', ')"
          }
          "Payload layout verified."

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      # Code signing.
      #
      # Unsigned, every download trips SmartScreen and some antivirus engines
      # quarantine the installer outright, which is the exact failure the
      # portable builder was written to avoid. Set these repository secrets to
      # turn it on; the build stays green without them so a fork can still
      # produce a working, unsigned artifact.
      #
      #   TAURI_SIGNING_PRIVATE_KEY           updater key, see docs
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      #   WINDOWS_CERTIFICATE                 base64 pfx, or use Azure signing
      #   WINDOWS_CERTIFICATE_PASSWORD
      - name: Report Signing Status
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            "Signing: a certificate is configured."
          } else {
            "Signing: NOT configured. This artifact will trip SmartScreen on download."
          }
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}

      - name: Build The Desktop Bundle
        run: npm exec --yes -- tauri build --config desktop/src-tauri/tauri.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate The Installer
        id: artifact
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Recurse -Filter "*-setup.exe" -Path "desktop/src-tauri/target/release/bundle" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) { throw "No installer was produced. Check the bundle step output." }
          "path=$($nsis.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Built $($nsis.Name), $([math]::Round($nsis.Length / 1MB, 1)) MB"

      - name: Upload The Installer
        uses: actions/upload-artifact@v4
        with:
          name: LinkedIn-Studio-Setup
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Attach To The Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
