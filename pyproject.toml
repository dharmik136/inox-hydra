[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inox-hydra"
description = "Local-first LinkedIn creator studio, analytics engine and inbound CRM. Zero cloud egress."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dynamic = ["version"]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    # Required by FastAPI for the media dropzone (UploadFile / Form endpoints).
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pillow>=10.2.0",
    "pymupdf>=1.24.0",
    "apscheduler>=3.10.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "flake8>=7.0.0", "build>=1.2.0"]

[tool.setuptools.dynamic]
version = { attr = "studio.__version__.__version__" }

# Explicit package list rather than auto-discovery. Auto-discovery silently
# swept studio.tests into the distributable, shipping test code to users.
[tool.setuptools]
packages = [
    "studio",
    "studio.backend",
    "studio.backend.agno_agentos",
    "studio.backend.agno_agentos.agents",
    "studio.backend.mcp_client",
    "studio.core",
]

# Non-Python files are not shipped by default. Omitting this is what produced a
# wheel that built successfully and then could not serve its own user interface.
#
# Declaring a directory is not enough, and neither is declaring the file types
# somebody remembered. frontend/ shipped as *.html, *.css and *.js, which left
# manifest.webmanifest and icons/*.png out of every wheel, so an installed copy
# served a page the browser would not offer to install. The test that was meant
# to catch this asked whether the string "frontend/" appeared anywhere in the
# pattern list, which it did.
#
# frontend_next/ is the built React interface. Its asset filenames carry a
# content hash and its asset types are whatever Vite decides to emit, so the
# static/ directory is declared wholesale rather than by extension. Everything
# in it is build output; there is nothing there that should not ship.
[tool.setuptools.package-data]
studio = [
    "frontend/*.html",
    "frontend/*.css",
    "frontend/*.js",
    "frontend/*.json",
    "frontend/*.webmanifest",
    "frontend/icons/*.png",
    "frontend/fonts/*.woff2",
    "frontend_next/*.html",
    "frontend_next/*.js",
    "frontend_next/*.webmanifest",
    "frontend_next/icons/*.png",
    "frontend_next/static/*",
    "extension/*.json",
    "extension/*.html",
    "extension/*.js",
    "extension/*.css",
    "extension/icons/*.png",
    "docs/*.md",
    "docs/modules/*.md",
]
