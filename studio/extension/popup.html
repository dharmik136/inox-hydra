<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Studio Bridge</title>
  <style>
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(14, 165, 233, 0.35);
    }
    h2 {
      font-size: 15px;
      margin: 0;
      font-weight: 700;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      margin-top: 2px;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .status-row strong {
      color: #f8fafc;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: #0ea5e9;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(14, 165, 233, 0.3);
    }
    .btn-primary:hover {
      background: #0284c7;
    }
    .btn-accent {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
    }
    .btn-accent:hover {
      background: rgba(99, 102, 241, 0.3);
      color: #ffffff;
    }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .status-msg {
      font-size: 11.5px;
      text-align: center;
      margin-top: 8px;
      color: #38bdf8;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">LS</div>
    <div>
      <h2>LinkedIn Studio Bridge</h2>
      <span class="badge" id="bridge-status">Checking Engine...</span>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>Local Engine (Port 8000):</span>
      <strong id="server-status" style="color: #34d399;">Online</strong>
    </div>
    <div class="status-row">
      <span>LinkedIn Session:</span>
      <strong id="session-status">Checking...</strong>
    </div>
    <div class="status-row">
      <span>Warm Leads in CRM:</span>
      <strong id="crm-leads-status" style="color: #a5b4fc;">Checking...</strong>
    </div>
  </div>

  <button class="btn btn-accent" id="btn-open-sidepanel">
    📑 Open Studio Side Panel
  </button>
  <button class="btn btn-primary" id="btn-sync">
    🔄 Sync LinkedIn Session
  </button>
  <button class="btn btn-secondary" id="btn-open-studio">
    📊 Open Full Web Dashboard
  </button>

  <div class="status-msg" id="status-text"></div>

  <script src="popup.js"></script>
</body>
</html>
