<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Studio - Side Panel</title>
  <style>
    :root {
      --bg-main: #0a0f1d;
      --bg-card: #141e33;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }
    h2 { font-size: 15px; font-weight: 700; }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
    }
    .side-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.03);
      padding: 3px;
      border-radius: 7px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 6px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
    }
    .toolbar {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11.5px;
      cursor: pointer;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      padding: 10px;
      outline: none;
      resize: vertical;
      margin-bottom: 8px;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }
    .btn-inject {
      background: #0ea5e9;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(14, 165, 233, 0.3);
    }
    .btn-inject:hover {
      background: #0284c7;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .queue-list-mini {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .queue-item-mini {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .queue-item-mini:hover {
      border-color: var(--accent);
    }
    .queue-item-time {
      font-size: 10.5px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 3px;
    }
    .queue-item-text {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast-mini {
      font-size: 11.5px;
      text-align: center;
      color: #38bdf8;
      min-height: 16px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-row">
      <div class="logo">LS</div>
      <div>
        <h2>LinkedIn Studio</h2>
      </div>
    </div>
    <span class="status-badge" id="side-status">Engine Online</span>
  </div>

  <div class="side-tabs">
    <button class="tab-btn active" id="tab-composer-btn">Composer</button>
    <button class="tab-btn" id="tab-queue-btn">Queued</button>
    <button class="tab-btn" id="tab-crm-btn">Warm CRM</button>
  </div>

  <!-- Panel 1: Composer & Quick Injector -->
  <div id="panel-composer">
    <div class="toolbar">
      <button class="tool-btn" id="sp-bold"><strong>𝗕</strong> Bold</button>
      <button class="tool-btn" id="sp-italic"><em>𝘐</em> Italic</button>
      <button class="tool-btn" id="sp-clean">🧹 Clean Dashes</button>
      <button class="tool-btn" id="sp-bullet">• Bullet</button>
      <button class="tool-btn" id="sp-arrow">→ Arrow</button>
    </div>

    <textarea id="sp-text" placeholder="Draft or paste your LinkedIn post here..."></textarea>

    <div class="meta-row">
      <span>Chars: <strong id="sp-char-count">0</strong></span>
      <span id="sp-fold-status" style="color: var(--success);">Fold Safe</span>
    </div>

    <button class="btn btn-inject" id="btn-inject-composer">
      🚀 Insert into LinkedIn Composer
    </button>
    <button class="btn btn-secondary" id="btn-copy-clipboard">
      📋 Copy to Clipboard
    </button>
  </div>

  <!-- Panel 2: Scheduled Queue Mini -->
  <div id="panel-queue" style="display: none;">
    <div class="queue-list-mini" id="queue-mini-list">
      <!-- Dynamically populated -->
    </div>
  </div>

  <!-- Panel 3: Warm CRM Mini -->
  <div id="panel-crm" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-size: 11.5px; color: var(--text-muted);">Warm Engager Pipeline</span>
      <span class="status-badge" id="sp-crm-count">0 Leads</span>
    </div>
    <div class="queue-list-mini" id="crm-mini-list">
      <!-- Dynamically populated -->
    </div>
  </div>

  <div style="margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border);">
    <button class="btn btn-secondary" id="btn-open-full-studio">
      📊 Open Full Dashboard
    </button>
    <div class="toast-mini" id="sp-toast"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
