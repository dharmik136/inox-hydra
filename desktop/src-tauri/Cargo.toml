[package]
name = "linkedin-studio-desktop"
version = "2.5.2"
description = "Native shell for the Inox Hydra LinkedIn Studio"
authors = ["Inox Hydra"]
edition = "2021"
rust-version = "1.77"

# The shell is a supervisor with a window attached, not an application in its
# own right. Everything the product does lives in the Python backend it starts.
# Keeping that boundary sharp is what allows the studio to run without this
# shell, which it must, since the browser extension path still needs a browser.

[lib]
name = "linkedin_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The updater is driven entirely from Rust, through the tray. It is
# deliberately not reachable from the window: the studio is a remote origin
# over loopback, and capabilities/default.json grants that origin nothing.
# A page in the webview must never be able to ask the shell to install
# software.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
# A smaller binary is a faster download and a smaller attack surface. None of
# this costs anything at runtime for a process that spends its life idle.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
