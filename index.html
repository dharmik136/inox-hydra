<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inox Hydra</title>
<meta name="description" content="Inox Hydra is a LinkedIn creator studio that runs on your own computer. This site hosts its privacy policy.">
<style>
:root {
  color-scheme: light dark;
  --paper: #fcfcfa; --ink: #1b1b19; --muted: #5c5c57; --edge: #dedcd6; --link: #1f5f4f;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #17171a; --ink: #e9e8e4; --muted: #a3a29c; --edge: #32323a; --link: #76c2ac; }
}
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: grid; place-items: center; min-height: 100vh;
}
main { max-width: 32rem; padding: 2rem 16px; }
h1 { font-size: 1.5rem; margin: 0 0 0.75rem; letter-spacing: -0.01em; }
p { margin: 0 0 1rem; color: var(--muted); }
a { color: var(--link); }
ul { padding-left: 1.2rem; }
li { margin-bottom: 0.5rem; }
</style>
</head>
<body>
<main>
<h1>Inox Hydra</h1>
<p>A LinkedIn creator studio that runs on your own computer. There is no server and no account.</p>
<ul>
<li><a href="privacy/">Privacy policy for the Inox Hydra Bridge browser extension</a></li>
<li><a href="https://github.com/dharmik136/inox-hydra">The project and its source</a></li>
</ul>
</main>
</body>
</html>
